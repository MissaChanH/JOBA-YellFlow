<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7c95b">
<meta name="mobile-web-app-capable" content="yes">
<title>Un pequeño jardín amarillo 🌻</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f4c65b;
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100dvh;
    min-height: 100svh;
    overflow: hidden;
    background: #f4c65b;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .65s ease, visibility .65s ease;
  }

  .screen.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background-repeat: no-repeat;
    background-position: center;
    /* The source artwork is intentionally used as the complete visual,
       so the programmed page stays visually faithful to the reference. */
    background-size: 100% 100%;
  }

  .tap-area {
    position: absolute;
    left: 50%;
    bottom: 5.3%;
    transform: translateX(-50%);
    width: min(76%, 330px);
    height: clamp(54px, 8vh, 82px);
    border: 0;
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  .tap-area:focus-visible {
    outline: 3px solid rgba(255,255,255,.9);
    outline-offset: 4px;
  }

  .letter-hit {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  @media (max-width: 360px) {
    .tap-area {
      width: 80%;
      bottom: 5%;
    }
  }

  @media (min-width: 700px) {
    .stage {
      max-width: 520px;
      margin: 0 auto;
      box-shadow: 0 0 60px rgba(83, 52, 18, .22);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen { transition: none; }
  }
</style>
</head>
<body>
<main class="stage" aria-label="Un pequeño jardín amarillo">
  <section id="garden" class="screen active" aria-label="Jardín">
    <div class="art" style="background-image:url('garden.webp');"></div>

    <!-- Zona táctil real sobre el botón "Seguir" que aparece en la ilustración. -->
    <button class="tap-area"
            type="button"
            aria-label="Seguir y abrir la carta"
            onclick="openLetter()"></button>
  </section>

  <section id="letter" class="screen" aria-label="Carta">
    <div class="art" style="background-image:url('letter.webp');"></div>
  </section>
</main>

<script>
  function openLetter() {
    const garden = document.getElementById('garden');
    const letter = document.getElementById('letter');

    garden.classList.remove('active');
    letter.classList.add('active');

    // Evita que el navegador conserve el foco del botón al cambiar de pantalla.
    document.activeElement?.blur();
  }
</script>
</body>
</html>
